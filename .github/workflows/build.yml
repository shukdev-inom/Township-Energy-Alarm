name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Find project folder
        id: find
        run: |
          F=$(find . -maxdepth 4 -name settings.gradle.kts -not -path './.git/*' | head -n 1)
          if [ -z "$F" ]; then
            echo "::error title=Project not found::settings.gradle.kts is missing. Files at repo root: $(ls -A | tr '\n' ' ')"
            exit 1
          fi
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      - name: Show the real error
        if: failure()
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          if [ -f build.log ]; then
            { echo '### Build errors'; echo '```'
              grep -E '^e: |error:|AAPT: error|ERROR:' build.log | head -30
              sed -n '/What went wrong/,/Try:/p' build.log | head -30
              echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            MSG=$( (grep -E '^e: |error:|AAPT: error|ERROR:' build.log; sed -n '/What went wrong/,/Try:/p' build.log) | head -15 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Build failed::$MSG"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: TownshipEnergyAlarm-apk
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
